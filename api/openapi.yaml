openapi: 3.0.0
info:
  title: Information Exchange Service
  description: API для обмена информацией об угрозах.
  version: 1.0.0

paths:
  /info/{md5}:
    get:
      summary: Получить информацию об угрозе по MD5
      description: Возвращает полную информацию об угрозе для указанного MD5-хеша.
      operationId: getInfoByMd5
      parameters:
        - name: md5
          in: path
          required: true
          description: MD5-хеш файла (32 символа, шестнадцатеричные цифры)
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{32}$'
            example: "d41d8cd98f00b204e9800998ecf8427e"
      responses:
        '200':
          description: Успешный ответ с информацией об угрозе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '404':
          description: Угроза с указанным MD5 не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Некорректный формат MD5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Обновить информацию об угрозе по MD5
      description: Заменяет информацию о существующей угрозе
      operationId: updateThreat
      parameters:
        - name: md5
          in: path
          required: true
          description: MD5-хеш обновляемой записи
          schema:
            type: string
            pattern: '^[a-fA-F0-9]{32}$'
            example: "d41d8cd98f00b204e9800998ecf8427e"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatUpdateRequest'
      responses:
        '200':
          description: Информация успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          description: Некорректные данные запроса или MD5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Угроза с указанным MD5 не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /info:
    post:
      summary: Создать новую запись об угрозе
      description: Добавляет новую информацию об угрозе. MD5 должен быть уникальным.
      operationId: createThreat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreatCreateRequest'
      responses:
        '201':
          description: Запись успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreatResponse'
        '400':
          description: Некорректные данные запроса (например, невалидный MD5)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Угроза с таким MD5 уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ThreatCreateRequest:
      type: object
      required: [md5, name, type, severity]
      properties:
        md5:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
          description: MD5-хеш файла (32 шестнадцатеричных символа)
          example: "d41d8cd98f00b204e9800998ecf8427e"
        name:
          type: string
          description: Название угрозы
          example: "Trojan.Win32.Generic"
        type:
          $ref: '#/components/schemas/ThreatType'
        severity:
          $ref: '#/components/schemas/Severity'
        description:
          type: string
          maxLength: 1000
          description: Описание угрозы
        sha256:
          $ref: '#/components/schemas/Sha256'
        cve:
          $ref: '#/components/schemas/CveList'
        vuln_status:
          $ref: '#/components/schemas/VulnStatus'
        playbook:
          $ref: '#/components/schemas/Playbook'



    ThreatUpdateRequest:
      type: object
      required: [name, type, severity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Название угрозы
          example: "Trojan.Win32.Generic"
        type:
          $ref: '#/components/schemas/ThreatType'
        severity:
          $ref: '#/components/schemas/Severity'
        description:
          type: string
          maxLength: 1000
          description: Описание угрозы
        sha256:
          $ref: '#/components/schemas/Sha256'
        cve:
          $ref: '#/components/schemas/CveList'
        vuln_status:
          $ref: '#/components/schemas/VulnStatus'
        playbook:
          $ref: '#/components/schemas/Playbook'



    ThreatResponse:
      type: object
      required: [md5, name, type, severity, vuln_status, cve, playbook, created_at, updated_at]
      properties:
        md5:
          type: string
          pattern: '^[a-fA-F0-9]{32}$'
          description: MD5-хеш
          example: "d41d8cd98f00b204e9800998ecf8427e"
        name:
          type: string
          description: Название угрозы
          example: "Trojan.Win32.Generic"
        type:
          $ref: '#/components/schemas/ThreatType'
        severity:
          $ref: '#/components/schemas/Severity'
        description:
          type: string
          description: Описание угрозы
        sha256:
          $ref: '#/components/schemas/Sha256'
        cve:
          $ref: '#/components/schemas/CveList'
        vuln_status:
          $ref: '#/components/schemas/VulnStatus'
        playbook:
          $ref: '#/components/schemas/Playbook'
        created_at:
          type: string
          format: date-time
          description: Время создания записи
        updated_at:
          type: string
          format: date-time
          description: Время последнего обновления



    ThreatType:
      type: string
      description: Вид угрозы
      enum: [trojan, ransomware, worm, spyware, adware, other]

    Severity:
      type: string
      description: Уровень опасности
      enum: [low, medium, high, critical]

    VulnStatus:
      type: string
      description: Текущий статут уязвимости
      enum: [unpatched, patch_available, patched, unknown]

    Sha256:
      type: string
      pattern: '^[a-fA-F0-9]{64}$'
      description: SHA-256 хеш файла (64 шестнадцатеричных символа)
      example: "027cc451313cd2b5c94d2225790c3900a932bc20343360b2e2d5563433af221a"

    CveList:
      type: array
      description: Связанные уязвимости (CVE), которые эксплуатирует угроза
      maxItems: 20
      items:
        type: string
        pattern: '^CVE-[0-9]{4}-[0-9]{4,}$'
        example: "CVE-2026-42503"

    Playbook:
      type: array
      description: Шаги реагирования на угрозу
      maxItems: 20
      items:
        type: string
        maxLength: 500
        example: "Изолировать заражённый хост от сети"



    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Человекочитаемое описание ошибки
          example: "Threat not found"
        details:
          type: string
          description: Дополнительная информация
          example: "No threat with MD5 d41d8cd98f00b204e9800998ecf8427e found"